<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Uma pergunta</title>
<style>
  :root{
    --bg1:#0f0c29; --bg2:#302b63; --bg3:#1a1a3d;
    --card: rgba(255,255,255,.06);
    --text:#f1eaff; --sub:#b8aed6; --accent:#d4af37;
  }
  *{box-sizing:border-box}
  html,body{height:100%; margin:0}
  body{
    font-family: Georgia, 'Times New Roman', serif;
    background: radial-gradient(circle at 30% 20%, var(--bg2), var(--bg1) 60%), var(--bg3);
    color: var(--text);
    display:flex; align-items:center; justify-content:center;
    min-height:100%; padding: max(20px, env(safe-area-inset-top,0px)) 20px max(20px, env(safe-area-inset-bottom,0px));
    overflow:hidden;
  }
  .card{
    background: var(--card); backdrop-filter: blur(8px);
    border: 1px solid rgba(212,175,55,.25);
    border-radius: 20px; padding: 36px 26px;
    max-width: 420px; width:100%; text-align:center;
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
  }
  h1{font-size:1.3rem; font-weight:400; margin:0 0 18px; letter-spacing:.3px}
  p{color:var(--sub); font-size:1.05rem; line-height:1.6; margin:0 0 22px; min-height: 3.2em; transition: opacity .4s ease}
  .fade{opacity:0}
  button{
    font-family: inherit; border:none; border-radius: 30px; padding: 13px 26px;
    font-size:1rem; cursor:pointer; transition: transform .15s ease;
  }
  button:active{ transform: scale(.96) }
  .primary{ background: linear-gradient(135deg, var(--accent), #f4d47a); color:#2a1e00; font-weight:600 }
  .primary:hover{ transform: scale(1.04) }
  .secondary{ background: rgba(255,255,255,.1); color: var(--sub); }
  .buttons{ display:flex; gap:14px; justify-content:center; align-items:center; position:relative; min-height: 70px; flex-wrap:wrap }
  #no{ position:relative }
  .hidden{ display:none !important }
  video, img.snap{ width:100%; border-radius:14px; margin: 14px 0; max-height:340px; object-fit:cover; background:#000 }
  .heart{position:fixed; pointer-events:none; font-size:22px; opacity:.8; animation: rise 3.5s ease-in forwards}
  @keyframes rise{ from{transform:translateY(0); opacity:.9} to{transform:translateY(-70vh); opacity:0} }
</style>
</head>
<body>

<!-- Tela 1: envelope -->
<div class="card" id="scene-intro">
  <div style="font-size:3rem; margin-bottom:14px">✉️</div>
  <h1>Tenho uma coisa pra te contar.</h1>
  <div class="buttons">
    <button class="primary" id="openLetter">Abrir</button>
  </div>
</div>

<!-- Tela 2: suspense -->
<div class="card hidden" id="scene-suspense">
  <p id="suspenseText"></p>
  <div class="buttons">
    <button class="primary" id="nextLine">Continuar</button>
  </div>
</div>

<!-- Tela 3: pergunta -->
<div class="card hidden" id="scene-question">
  <h1 id="questionText"></h1>
  <div class="buttons" id="buttonZone">
    <button class="primary" id="yes">Sim</button>
    <button class="secondary" id="no">Não</button>
  </div>
  <p id="dodgeMsg" style="margin-top:16px; min-height:1.4em"></p>
</div>

<!-- Tela 4: celebração + foto -->
<div class="card hidden" id="scene-yes">
  <h1>🎉 Aeee!</h1>
  <div id="photoArea">
    <div class="buttons">
      <button class="primary" id="startCam">Guardar esse momento (tirar foto)</button>
    </div>
    <video id="video" class="hidden" autoplay playsinline></video>
    <div class="buttons hidden" id="camButtons">
      <button class="primary" id="capture">Capturar</button>
    </div>
    <img id="snap" class="snap hidden">
    <div class="buttons hidden" id="downloadRow">
      <a class="primary" id="download" download="nosso-momento.png" style="text-decoration:none; display:inline-block">Baixar foto</a>
      <button class="secondary" id="retake">Tirar de novo</button>
    </div>
  </div>
</div>

<canvas id="canvas" class="hidden"></canvas>

<script>
// ======================================================
// EDITE AQUI o nome da pessoa antes de publicar o site.
// Também é possível sobrescrever pela URL: ?nome=Maria
// ======================================================
const DEFAULT_NAME = "Você";

const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
const NAME = params.get('nome') || DEFAULT_NAME;
$('questionText').textContent = `${NAME}, você quer namorar comigo?`;

// ---------- Suspense ----------
const lines = [
  "Faz um tempo que eu venho pensando em uma coisa...",
  "Não é sobre trabalho, nem sobre o que vamos comer hoje.",
  "É sobre nós dois.",
  "Prometo que não é nada ruim (eu acho).",
  "Ok, chega de enrolação.",
];
let lineIdx = 0;
const suspenseText = $('suspenseText');

$('openLetter').addEventListener('click', () => {
  $('scene-intro').classList.add('hidden');
  $('scene-suspense').classList.remove('hidden');
  suspenseText.textContent = lines[0];
});

$('nextLine').addEventListener('click', () => {
  lineIdx++;
  if (lineIdx < lines.length) {
    suspenseText.classList.add('fade');
    setTimeout(() => { suspenseText.textContent = lines[lineIdx]; suspenseText.classList.remove('fade'); }, 250);
  } else {
    $('scene-suspense').classList.add('hidden');
    $('scene-question').classList.remove('hidden');
  }
});

// ---------- Pergunta com botão "Não" fujão ----------
const dodgePhrases = [
  "Ainda não 😏","Quase!","Tenta de novo","Nada de fugir","Vem cá, não morde",
  "Essa foi por pouco","Só clica no Sim...","Tá difícil, hein","Insistente você",
  "Mais perto ainda não é","Hmm, não hoje","Foi mal 😅","Segura essa","Última chance de acertar",
  "Vamos ver quanto tempo você aguenta","Só o Sim funciona aqui"
];
const noBtn = $('no'); const zone = $('buttonZone'); const dodgeMsg = $('dodgeMsg');

function dodge(){
  const zr = zone.getBoundingClientRect(), br = noBtn.getBoundingClientRect();
  const maxX = Math.max(zr.width - br.width, 60);
  const x = (Math.random()*maxX) - maxX/2;
  const y = (Math.random()*50) - 25;
  noBtn.style.position='relative';
  noBtn.style.left = x+'px'; noBtn.style.top = y+'px';
  dodgeMsg.textContent = dodgePhrases[Math.floor(Math.random()*dodgePhrases.length)];
}
noBtn.addEventListener('mouseenter', dodge);
noBtn.addEventListener('click', e => { e.preventDefault(); dodge(); });
noBtn.addEventListener('touchstart', e => { e.preventDefault(); dodge(); }, {passive:false});

$('yes').addEventListener('click', () => {
  $('scene-question').classList.add('hidden');
  $('scene-yes').classList.remove('hidden');
  for(let i=0;i<16;i++){
    const h=document.createElement('div'); h.className='heart'; h.textContent = ['❤️','💛','✨','💫'][Math.floor(Math.random()*4)];
    h.style.left = Math.random()*100+'vw'; h.style.bottom = '-20px';
    document.body.appendChild(h); setTimeout(()=>h.remove(), 3600);
  }
});

// ---------- Foto ----------
let stream = null;
$('startCam').addEventListener('click', async () => {
  const startButton = $('startCam');
  if (!navigator.mediaDevices?.getUserMedia) {
    startButton.textContent = 'Abra esta página em um navegador seguro para usar a câmera';
    return;
  }

  startButton.disabled = true;
  startButton.textContent = 'Solicitando acesso à câmera…';
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
    const video = $('video');
    video.srcObject = stream;
    await video.play();
    video.classList.remove('hidden');
    $('camButtons').classList.remove('hidden');
    startButton.classList.add('hidden');
  } catch(e) {
    if (stream) stream.getTracks().forEach(track => track.stop());
    stream = null;
    startButton.disabled = false;
    startButton.textContent = e.name === 'NotAllowedError'
      ? 'Permita o acesso à câmera e tente novamente'
      : 'Câmera indisponível — tente novamente';
  }
});

$('capture').addEventListener('click', () => {
  const video = $('video'); const canvas = $('canvas');
  canvas.width = video.videoWidth; canvas.height = video.videoHeight;
  canvas.getContext('2d').drawImage(video, 0, 0);
  const url = canvas.toDataURL('image/png');
  $('snap').src = url;
  $('snap').classList.remove('hidden');
  $('download').href = url;
  video.classList.add('hidden');
  $('camButtons').classList.add('hidden');
  $('downloadRow').classList.remove('hidden');
  if (stream) { stream.getTracks().forEach(t => t.stop()); }
});

$('retake').addEventListener('click', () => {
  $('snap').classList.add('hidden');
  $('downloadRow').classList.add('hidden');
  $('startCam').classList.remove('hidden');
  $('startCam').disabled = false;
  $('startCam').textContent = 'Guardar esse momento (tirar foto)';
});
</script>

</body>
</html>
