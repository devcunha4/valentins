<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Uma carta para você</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f6efdd; --paper-edge:#ecdfbd; --paper-shadow:#d8c69a;
    --ink:#332618; --ink-soft:#6c5a44; --ink-faint:#948267;
    --wax:#7d2334; --wax-dark:#5c1826; --gold:#a17f3f; --line:#c8ae7c;
  }
  html:not([data-theme="light"]){ }
  :root:not([data-theme="light"]) { }
  * { box-sizing: border-box; }
  html, body { height:100%; margin:0; }
  body{
    font-family: 'EB Garamond', Georgia, serif;
    color: var(--ink);
    background:
      repeating-linear-gradient(45deg, rgba(0,0,0,.012) 0 2px, transparent 2px 4px),
      radial-gradient(circle at 20% 15%, #f3e6c2, #d9c295 55%, #b89b66 100%);
    min-height:100%;
    display:flex; align-items:center; justify-content:center;
    padding: max(24px, env(safe-area-inset-top,0px)) 18px max(24px, env(safe-area-inset-bottom,0px));
  }
  .card{
    position:relative;
    background: var(--paper);
    background-image: repeating-radial-gradient(circle at 30% 20%, rgba(160,120,60,.05) 0, transparent 40px);
    max-width: 440px; width:100%;
    padding: 46px 34px 38px;
    text-align:center;
    box-shadow:
      0 0 0 1px var(--line),
      0 0 0 7px var(--paper),
      0 0 0 8px var(--line),
      0 24px 50px -10px rgba(60,40,10,.35);
  }
  .flourish{ display:flex; align-items:center; justify-content:center; gap:10px; margin: 0 0 20px; color: var(--gold); }
  .flourish::before, .flourish::after{ content:""; height:1px; width:34px; background: var(--line); }
  .flourish span{ font-size:1.1rem; transform: translateY(-1px); }

  h1{
    font-family:'Cormorant Garamond', serif;
    font-style:italic; font-weight:600;
    font-size:1.65rem; line-height:1.35;
    margin: 0 0 22px; color: var(--ink);
  }
  p{ color: var(--ink-soft); font-size:1.12rem; line-height:1.75; margin:0 0 24px; min-height:3em; transition: opacity .5s ease; }
  p.fade{ opacity:0; }

  button, .btn{
    font-family:'EB Garamond', serif; font-size:1.05rem;
    border-radius: 3px; cursor:pointer; transition: transform .15s ease, box-shadow .15s ease;
  }
  button:active{ transform: scale(.97); }

  .seal{
    width:88px; height:88px; border-radius:50%; margin: 6px auto 26px;
    background: radial-gradient(circle at 32% 28%, #9c3348, var(--wax) 55%, var(--wax-dark) 100%);
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 8px 18px rgba(90,20,30,.4), inset 0 -4px 8px rgba(0,0,0,.25);
    border:none; color:#f2d8bd; font-family:'Cormorant Garamond', serif; font-style:italic; font-size:1.6rem;
  }
  .seal:hover{ transform: scale(1.04); }

  .primary{
    background: linear-gradient(180deg, var(--wax), var(--wax-dark));
    color:#f4e4cf; padding:13px 30px; border:1px solid var(--wax-dark);
    box-shadow: 0 6px 14px rgba(90,20,30,.28);
  }
  .primary:hover{ box-shadow: 0 8px 18px rgba(90,20,30,.35); }

  .textlink{
    background:none; border:none; color: var(--gold); font-style:italic;
    border-bottom: 1px solid var(--line); padding: 4px 2px;
  }
  .textlink:hover{ color: var(--wax); border-color: var(--wax); }

  .secondary{
    background: transparent; color: var(--ink-faint); padding:12px 24px;
    border: 1px solid var(--paper-shadow);
  }
  .secondary:hover{ color: var(--ink-soft); border-color: var(--gold); }

  .buttons{ display:flex; gap:16px; justify-content:center; align-items:center; position:relative; min-height:60px; flex-wrap:wrap; }
  #no{ position:relative; }
  .hidden{ display:none !important; }

  #dodgeMsg{ margin-top:14px; min-height:1.4em; font-style:italic; color: var(--ink-faint); font-size:.98rem; }

  video, img.snap{ width:100%; border-radius:4px; margin:16px 0; max-height:340px; object-fit:cover; background:#1a1208; box-shadow: 0 0 0 1px var(--line); }

  .petal{
    position:fixed; top:-20px; pointer-events:none; font-size:0; width:9px; height:14px;
    background: linear-gradient(180deg, #b7495c, #7d2334);
    border-radius: 0 60% 0 60%;
    animation: fall linear forwards;
    opacity:.85;
  }
  @keyframes fall{
    to{ transform: translateY(105vh) rotate(300deg); opacity:0; }
  }

  @media (max-width:380px){
    .card{ padding: 38px 22px 30px; }
    h1{ font-size:1.4rem; }
  }
</style>
</head>
<body>

<!-- Tela 1: selo de cera -->
<div class="card" id="scene-intro">
  <div class="flourish"><span>❦</span></div>
  <h1>Tenho uma coisa para te contar.</h1>
  <button class="seal" id="openLetter" aria-label="Abrir a carta">Abrir</button>
</div>

<!-- Tela 2: suspense -->
<div class="card hidden" id="scene-suspense">
  <div class="flourish"><span>❦</span></div>
  <p id="suspenseText"></p>
  <div class="buttons">
    <button class="textlink" id="nextLine">virar a página</button>
  </div>
</div>

<!-- Tela 3: pergunta -->
<div class="card hidden" id="scene-question">
  <div class="flourish"><span>❦</span></div>
  <h1 id="questionText"></h1>
  <div class="buttons" id="buttonZone">
    <button class="primary" id="yes">Sim</button>
    <button class="secondary" id="no">Não</button>
  </div>
  <p id="dodgeMsg"></p>
</div>

<!-- Tela 4: celebração + foto -->
<div class="card hidden" id="scene-yes">
  <div class="flourish"><span>❦</span></div>
  <h1>Está selado.</h1>
  <p style="font-style:italic">Agora é só ter que enfrentar seu pai 😅</p>
  <div id="photoArea">
    <div class="buttons">
      <button class="primary" id="startCam">Guardar esse momento</button>
    </div>
    <video id="video" class="hidden" autoplay playsinline></video>
    <div class="buttons hidden" id="camButtons">
      <button class="primary" id="capture">Capturar</button>
    </div>
    <img id="snap" class="snap hidden">
    <div class="buttons hidden" id="downloadRow">
      <a class="primary" id="download" download="nosso-momento.png" style="text-decoration:none; display:inline-block">Baixar foto</a>
      <button class="secondary" id="retake">Tirar de novo</button>
    </div>
  </div>
</div>

<canvas id="canvas" class="hidden"></canvas>

<script>
// ======================================================
// EDITE AQUI o nome da pessoa antes de publicar o site.
// Também é possível sobrescrever pela URL: ?nome=Maria
// ======================================================
const DEFAULT_NAME = "Você";

const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
const NAME = params.get('nome') || DEFAULT_NAME;
$('questionText').textContent = `${NAME}, você quer namorar comigo?`;

// ---------- Suspense ----------
const lines = [
  "Faz um tempo que eu venho pensando em uma coisa...",
  "Não é sobre trabalho, nem sobre o que vamos comer hoje.",
  "É sobre nós dois.",
  "Prometo que não é nada ruim (eu acho).",
  "Ok, chega de enrolação.",
];
let lineIdx = 0;
const suspenseText = $('suspenseText');

$('openLetter').addEventListener('click', () => {
  $('scene-intro').classList.add('hidden');
  $('scene-suspense').classList.remove('hidden');
  suspenseText.textContent = lines[0];
});

$('nextLine').addEventListener('click', () => {
  lineIdx++;
  if (lineIdx < lines.length) {
    suspenseText.classList.add('fade');
    setTimeout(() => { suspenseText.textContent = lines[lineIdx]; suspenseText.classList.remove('fade'); }, 280);
  } else {
    $('scene-suspense').classList.add('hidden');
    $('scene-question').classList.remove('hidden');
  }
});

// ---------- Pergunta com botão "Não" fujão ----------
const dodgePhrases = [
  "Ainda não 😏","Quase!","Tenta de novo","Nada de fugir","Vem cá, não morde",
  "Essa foi por pouco","Só clica no Sim...","Tá difícil, hein","Insistente você",
  "Mais perto ainda não é","Hmm, não hoje","Foi mal","Segura essa","Última chance de acertar",
  "Vamos ver quanto tempo você aguenta","Só o Sim funciona aqui"
];
const noBtn = $('no'); const zone = $('buttonZone'); const dodgeMsg = $('dodgeMsg');

function dodge(){
  const zr = zone.getBoundingClientRect(), br = noBtn.getBoundingClientRect();
  const maxX = Math.max(zr.width - br.width, 60);
  const x = (Math.random()*maxX) - maxX/2;
  const y = (Math.random()*50) - 25;
  noBtn.style.position='relative';
  noBtn.style.left = x+'px'; noBtn.style.top = y+'px';
  dodgeMsg.textContent = dodgePhrases[Math.floor(Math.random()*dodgePhrases.length)];
}
noBtn.addEventListener('mouseenter', dodge);
noBtn.addEventListener('click', e => { e.preventDefault(); dodge(); });
noBtn.addEventListener('touchstart', e => { e.preventDefault(); dodge(); }, {passive:false});

$('yes').addEventListener('click', () => {
  $('scene-question').classList.add('hidden');
  $('scene-yes').classList.remove('hidden');
  for(let i=0;i<18;i++){
    const p=document.createElement('div'); p.className='petal';
    p.style.left = Math.random()*100+'vw';
    p.style.animationDuration = (2.8 + Math.random()*1.6)+'s';
    p.style.animationDelay = (Math.random()*0.6)+'s';
    document.body.appendChild(p);
    setTimeout(()=>p.remove(), 5000);
  }
});

// ---------- Foto ----------
let stream = null;
$('startCam').addEventListener('click', async () => {
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
    $('video').srcObject = stream;
    $('video').classList.remove('hidden');
    $('camButtons').classList.remove('hidden');
    $('startCam').classList.add('hidden');
  } catch(e) {
    $('startCam').textContent = 'Câmera indisponível';
  }
});

$('capture').addEventListener('click', () => {
  const video = $('video'); const canvas = $('canvas');
  canvas.width = video.videoWidth; canvas.height = video.videoHeight;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(video, 0, 0);

  // Carimbo com a data do dia
  const dataHoje = new Date().toLocaleDateString('pt-BR', { day:'2-digit', month:'2-digit', year:'numeric' });
  const pad = Math.max(canvas.width, canvas.height) * 0.025;
  const fontSize = Math.max(canvas.width, canvas.height) * 0.032;
  ctx.font = `italic ${fontSize}px 'Cormorant Garamond', Georgia, serif`;
  ctx.textAlign = 'right';
  ctx.textBaseline = 'bottom';
  ctx.shadowColor = 'rgba(0,0,0,.55)';
  ctx.shadowBlur = fontSize * 0.3;
  ctx.fillStyle = '#f6efdd';
  ctx.fillText(dataHoje, canvas.width - pad, canvas.height - pad);
  ctx.shadowBlur = 0;

  const url = canvas.toDataURL('image/png');
  $('snap').src = url;
  $('snap').classList.remove('hidden');
  $('download').href = url;
  video.classList.add('hidden');
  $('camButtons').classList.add('hidden');
  $('downloadRow').classList.remove('hidden');
  if (stream) { stream.getTracks().forEach(t => t.stop()); }
});

$('retake').addEventListener('click', () => {
  $('snap').classList.add('hidden');
  $('downloadRow').classList.add('hidden');
  $('startCam').classList.remove('hidden');
  $('startCam').textContent = 'Guardar esse momento';
});
</script>

</body>
</html>
